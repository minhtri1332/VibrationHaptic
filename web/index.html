<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Gửi tín hiệu rung A–D đến thiết bị qua Firebase Realtime Database" />
  <title>Tín hiệu rung — VibrationHaptic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Gradient background layer -->
    <div class="gradient-bg"></div>

    <!-- ===== HOME SCREEN ===== -->
    <div id="screen-home" class="screen active">
      <header class="header">
        <h1 class="header-title">Tín hiệu rung</h1>
        <button id="btn-manage" class="header-action" aria-label="Quản lý thiết bị" title="Quản lý thiết bị">✎</button>
      </header>
      <div class="cards">
        <button id="card-send" class="feature-card">
          <div class="card-accent" style="background:#3b6cf6"></div>
          <div class="card-body">
            <span class="card-title">Truyền tín hiệu</span>
            <span class="card-desc">Chọn thiết bị rồi gửi A, B, C hoặc D</span>
          </div>
          <span class="card-chevron">›</span>
        </button>
      </div>

    </div>

    <!-- ===== DEVICE LIST SCREEN ===== -->
    <div id="screen-devices" class="screen">
      <header class="header">
        <button class="back-btn" data-back aria-label="Quay lại">‹</button>
        <h1 class="header-title">Chọn thiết bị</h1>
      </header>
      <div id="device-list" class="cards">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- ===== SEND SCREEN ===== -->
    <div id="screen-send" class="screen">
      <header class="header">
        <button class="back-btn" data-back aria-label="Quay lại">‹</button>
        <h1 class="header-title" id="send-header">Gửi tới: …</h1>
      </header>
      <p id="send-status" class="send-status">Chọn tín hiệu để gửi</p>
      <div class="signal-grid">
        <button class="signal-btn" data-letter="A">
          <span class="signal-letter">A</span>
          <span class="signal-pulses">1 lần rung</span>
        </button>
        <button class="signal-btn" data-letter="B">
          <span class="signal-letter">B</span>
          <span class="signal-pulses">2 lần rung</span>
        </button>
        <button class="signal-btn" data-letter="C">
          <span class="signal-letter">C</span>
          <span class="signal-pulses">3 lần rung</span>
        </button>
        <button class="signal-btn" data-letter="D">
          <span class="signal-letter">D</span>
          <span class="signal-pulses">4 lần rung</span>
        </button>
      </div>
    </div>

    <!-- ===== MANAGE SCREEN ===== -->
    <div id="screen-manage" class="screen">
      <header class="header">
        <button class="back-btn" data-back aria-label="Quay lại">‹</button>
        <h1 class="header-title">Quản lý thiết bị</h1>
      </header>
      <p class="section-label">DANH SÁCH THIẾT BỊ</p>
      <div id="manage-list" class="device-rows">
        <!-- Populated by JS -->
      </div>
    </div>


    <!-- ===== TOAST ===== -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- Firebase SDKs (compat for simplicity) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
